- description: 'ts-best-practices-functional / handles invalid JSON and invalid shapes separately'
  vars:
    skill: ts-best-practices-functional
    files:
      parse-config.ts: |
        export function parseConfig(raw: string): { port: number } {
          return JSON.parse(raw)
        }
    task: >-
      Refactor parse-config.ts to use a self-contained Result union, without
      dependencies. Validate an integer port from 1 to 65535. Invalid JSON
      and schema mismatch must be distinguishable errors. Return only a
      TypeScript code block containing the complete replacement module.
  assert:
    - type: contains
      transform: JSON.stringify(output.readFiles)
      value: parse-config.ts
    - type: contains-all
      transform: output.answer
      value: [try, catch, invalid_json, schema_mismatch, Number.isInteger, unknown]
    - type: regex
      transform: output.answer
      value: '65535|65_535'
    - type: not-regex
      transform: output.answer
      value: '\bthrow\b|:\s*any\b'
