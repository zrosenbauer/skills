- description: 'ts-best-practices / narrows untrusted values rather than asserting a type'
  vars:
    skill: ts-best-practices
    files:
      read-label.ts: |
        export function readLabel(input: any): string {
          return input.label
        }
    task: >-
      Fix read-label.ts using this skill. The input is untrusted. Preserve
      the exported name. Return null when input is not a non-null object
      with a string label. Return only the replacement TypeScript module
      in one code block. Do not install dependencies.
  assert:
    - type: contains
      transform: JSON.stringify(output.readFiles)
      value: read-label.ts
    - type: regex
      transform: output.answer
      value: 'input:\s*unknown'
    - type: contains-all
      transform: output.answer
      value: [typeof, 'null', string, '@param', '@returns']
    - type: not-regex
      transform: output.answer
      value: '\bany\b'
