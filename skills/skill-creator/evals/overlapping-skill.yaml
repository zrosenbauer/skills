- description: 'skill-creator / extends an overlapping skill instead of inventing a duplicate'
  vars:
    skill: skill-creator
    files:
      catalog.txt: |
        ts-best-practices: object parameters, JSDoc on exports, kebab-case TypeScript files, branded identifiers, discriminated unions, exhaustive branching.
    task: >-
      Read catalog.txt as the complete overlap inventory. I want a new skill
      enforcing object parameters, exported-function JSDoc, and kebab-case
      TypeScript filenames. Decide whether to create one or extend an
      existing skill. Return only JSON with action (create or extend),
      existingSkill (string or null), and reason (string). Do not write files.
  assert:
    - type: contains
      transform: JSON.stringify(output.readFiles)
      value: catalog.txt
    - type: is-json
      transform: output.answer
      value:
        required: [action, existingSkill, reason]
        properties:
          action: { const: extend }
          existingSkill: { const: ts-best-practices }
          reason: { type: string, minLength: 1 }
    - type: regex
      transform: (JSON.parse(output.answer).reason ?? '').toLowerCase()
      value: 'overlap|already|duplicat'
