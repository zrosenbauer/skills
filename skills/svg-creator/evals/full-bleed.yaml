- description: 'svg-creator / produces a full-bleed standalone SVG'
  vars:
    skill: svg-creator
    task: >-
      Give me only the SVG source for a standalone 96 by 96 square icon.
      Fill the entire square with solid #123456. No text, rounded corners,
      margins, external styles, or other shapes. Source only. Do not preview
      or convert it, and do not claim browser verification.
  assert:
    - type: regex
      transform: output.answer
      value: '<svg\b[^>]*viewBox\s*=\s*["'']0 0 96 96["'']'
    - type: regex
      transform: output.answer
      value: '<rect\b(?=[^>]*\bwidth\s*=\s*["'']96["''])(?=[^>]*\bheight\s*=\s*["'']96["''])(?=[^>]*\bfill\s*=\s*["'']#123456["''])[^>]*>'
    - type: not-regex
      transform: output.answer
      value: 'var\(|currentColor|<script|<text|<style|\brx\s*=|\bry\s*=|\b[xy]\s*=\s*["''](?!0["''])'
