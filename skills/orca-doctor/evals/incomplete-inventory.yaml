- description: 'orca-doctor / stops recovery when inventory coverage is incomplete'
  vars:
    skill: orca-doctor
    files:
      diagnostic.json: |
        {"ok":false,"coverage":{"complete":false},"worktrees":[{"name":"feat/a","actions":["inspect"],"activity":"unknown"}]}
    task: >-
      Interpret diagnostic.json as a captured doctor result. Do not contact
      Orca or run recovery commands. Return only JSON with canRecoverNow
      (boolean), nextAction (string), and reason (string).
  assert:
    - type: contains
      transform: JSON.stringify(output.readFiles)
      value: diagnostic.json
    - type: is-json
      transform: output.answer
      value:
        required: [canRecoverNow, nextAction, reason]
        properties:
          canRecoverNow: { const: false }
          nextAction: { type: string, minLength: 1 }
          reason: { type: string, minLength: 1 }
    - type: regex
      transform: (JSON.parse(output.answer).nextAction ?? '').toLowerCase()
      value: 'inspect|stop|refresh|audit|diagnos'
    - type: regex
      transform: (JSON.parse(output.answer).reason ?? '').toLowerCase()
      value: 'incomplete|coverage|unknown'
