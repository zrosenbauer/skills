# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Core behavior and boundary evaluations for all public skills
sharing: false

prompts:
  - '{{task}}'

providers:
  - id: exec:bun skill-scripts/eval-skill.mjs
    label: installed-cli
    config:
      agent: codex # codex or claude, uses that CLI's existing login
      timeoutMs: 120000

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    transform: JSON.parse(output)
  assert:
    - type: is-json
      value:
        required: [loadedSkill, permissionDenials]
        properties:
          loadedSkill: { const: true }
          permissionDenials: { type: array, maxItems: 0 }

tests:
  - file://skills/*/evals/*.yaml
