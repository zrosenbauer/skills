# Lefthook config — pre-commit checks for the skills monorepo.
# Docs: https://lefthook.dev/configuration/
#
# Hook install:
#   pnpm install                # auto-runs `lefthook install` via the prepare script
#   pnpm exec lefthook install  # manual install if needed
#
# Skip a hook ad-hoc:
#   LEFTHOOK=0 git commit ...   # skips all hooks
#   git commit --no-verify      # built-in git skip (avoid in CI/automation)

pre-commit:
  jobs:
    # 1. Vendor canonical scripts when their source changes. The synced
    #    files (under skills/*/scripts/<name>/) get auto-staged.
    - name: sync-skill-scripts
      glob: 'skill-scripts/**'
      run: pnpm skill-toolkit sync
      stage_fixed: true

    # 2. Auto-format staged files. Re-stage anything reformatted.
    #    Skips schemas/** — those files are generated by
    #    `pnpm skill-toolkit schema --write`, and the drift check
    #    (job 6) compares them byte-for-byte against the regenerated
    #    output. Letting oxfmt rewrite them would make that check
    #    permanently fail.
    - name: format
      glob: '*.{js,mjs,cjs,ts,tsx,jsx,json,md}'
      exclude:
        - 'schemas/**'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    # 3. Lint staged JS/TS. Fail commit on errors.
    #    Excludes mirror .oxlintrc.json `ignorePatterns` so oxlint isn't
    #    invoked with a list of paths it will all filter out (which exits
    #    non-zero with "No files found to lint").
    - name: lint
      glob: '*.{js,mjs,cjs,ts,tsx,jsx}'
      exclude:
        - '.agents/skills/**'
        - '**/.workspace/**'
        - '**/dist/**'
        - '**/build/**'
        - '**/node_modules/**'
      run: pnpm exec oxlint {staged_files}

    # 4. Skill-specific lint (three-tier rules) when any skill or
    #    skill-script source changes.
    - name: skills-lint
      glob: '{skills,.agents/skills,skill-scripts}/**'
      run: pnpm skill-toolkit lint --severity error

    # 5. Drift check — vendored copies must match source. Catches
    #    hand-edited vendored copies that didn't trigger sync above.
    - name: sync-check
      run: pnpm skill-toolkit sync --check

    # 6. Schema drift check — schemas/skill.json must match the zod
    #    source in packages/skill-toolkit/src/lib/skills/manifest.ts.
    #    Catches manifest schema changes that didn't regenerate the
    #    JSON Schema file. Refresh with `pnpm skill-toolkit schema --write`.
    - name: schema-check
      run: pnpm skill-toolkit schema --check
