name: ci-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bundle --force
      - run: pnpm skill-toolkit sync
      - name: Check generated assets are committed
        run: |
          git diff --exit-code -- skill-scripts skills
          test -z "$(git ls-files --others --exclude-standard -- skill-scripts skills)"
      - run: pnpm check
      - run: pnpm commands:opencode --check
      - run: pnpm skill-toolkit lint --severity error
      - run: pnpm skill-toolkit sync --check
      - run: pnpm skill-toolkit schema --check
